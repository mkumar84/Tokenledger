[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenledger"
version = "0.1.0"
description = "TokenLedger — AI Tokenomics & Adoption FinOps engines (synthetic-data portfolio project)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "pydantic>=2.5,<3.0",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools]
packages = ["tokenledger", "tokenledger.engines"]

[tool.pytest.ini_options]
testpaths = ["tests"]
